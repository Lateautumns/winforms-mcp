name: Release Stable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-stable
  cancel-in-progress: true

jobs:
  release:
    # The release commit pushed by this workflow must not start a second run.
    if: "github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release version'))"
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET (pinned SDK from global.json)
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Setup MSBuild (Visual Studio)
      uses: microsoft/setup-msbuild@v2

    - name: Extract and prepare version
      id: version
      shell: pwsh
      run: |
        # Read version from VERSION file
        $version = (Get-Content VERSION).Trim()
        Write-Host "Version from file: $version"

        # Remove -beta suffix for stable release
        $stableVersion = $version -replace '-beta$', ''
        Write-Host "Stable version: $stableVersion"

        # Update every version source (no commit yet; the gates below must pass
        # before any version commit, tag, or package push)
        ./scripts/sync-version.ps1 -NewVersion $stableVersion

        echo "version=$stableVersion" >> $env:GITHUB_OUTPUT

    # Release gates: all of them must pass before the version commit and tag.
    - name: Restore dependencies
      run: dotnet restore Rhombus.WinFormsMcp.sln

    - name: Verify code formatting
      run: dotnet format Rhombus.WinFormsMcp.sln --verify-no-changes --verbosity quiet

    - name: Build
      run: dotnet build Rhombus.WinFormsMcp.sln --configuration Release --no-restore

    - name: Build RendererHost (multi-target)
      run: dotnet build src/Rhombus.WinFormsMcp.RendererHost/Rhombus.WinFormsMcp.RendererHost.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test Rhombus.WinFormsMcp.sln --configuration Release --no-build --logger "console;verbosity=minimal"

    - name: Check the three NuGet packages
      shell: pwsh
      run: ./scripts/pack-nuget.ps1 -Configuration Release -Version ${{ steps.version.outputs.version }} -OutputRoot ./package-publish

    - name: Smoke-test .NET Framework 4.7.2 consumers
      shell: pwsh
      run: ./scripts/verify-net472-consumers.ps1 -Configuration Release -PackageRoot ./package-publish/nuget

    - name: Commit version update
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add VERSION npm/package.json src/Rhombus.WinFormsMcp.Server/Rhombus.WinFormsMcp.Server.csproj src/Rhombus.WinFormsMcp.RuntimeContracts/Rhombus.WinFormsMcp.RuntimeContracts.csproj src/Rhombus.WinFormsMcp.RuntimeBridge/Rhombus.WinFormsMcp.RuntimeBridge.csproj
        git diff --staged --quiet || git commit -m "chore: release version ${{ steps.version.outputs.version }}"
        git tag "v${{ steps.version.outputs.version }}"
        git push
        git push origin "v${{ steps.version.outputs.version }}"

    - name: Generate changelog
      id: changelog
      shell: pwsh
      run: |
        # Find the previous release tag (skip the tag we just created)
        $allTags = git tag --sort=-v:refname | Where-Object { $_ -match '^v\d' }
        $currentTag = "v${{ steps.version.outputs.version }}"
        $prevTag = ($allTags | Where-Object { $_ -ne $currentTag } | Select-Object -First 1)
        if (-not $prevTag) { $prevTag = (git rev-list --max-parents=0 HEAD) }
        Write-Host "Generating changelog from $prevTag to $currentTag"

        # Get commits grouped by conventional commit type (deduplicate by message to avoid merge duplication)
        $commits = git log "$prevTag..$currentTag" --pretty=format:"%s" --no-merges | Sort-Object -Unique | Where-Object { $_ }

        $features = @(); $fixes = @(); $docs = @(); $other = @()
        foreach ($msg in $commits) {
          if ($msg -match '^feat:') { $features += $msg -replace '^feat:\s*', '' }
          elseif ($msg -match '^fix:') { $fixes += $msg -replace '^fix:\s*', '' }
          elseif ($msg -match '^docs:') { $docs += $msg -replace '^docs:\s*', '' }
          elseif ($msg -notmatch '^chore: (release version|bump version)') { $other += $msg }
        }

        $body = ""
        if ($features.Count -gt 0) {
          $body += "### Features`n"
          foreach ($f in $features) { $body += "- $f`n" }
          $body += "`n"
        }
        if ($fixes.Count -gt 0) {
          $body += "### Fixes`n"
          foreach ($f in $fixes) { $body += "- $f`n" }
          $body += "`n"
        }
        if ($docs.Count -gt 0) {
          $body += "### Docs`n"
          foreach ($f in $docs) { $body += "- $f`n" }
          $body += "`n"
        }
        if ($other.Count -gt 0) {
          $body += "### Other`n"
          foreach ($f in $other) { $body += "- $f`n" }
          $body += "`n"
        }

        if (-not $body) { $body = "Maintenance release.`n" }

        # Write to file for multi-line output
        $body | Out-File -FilePath changelog.md -Encoding utf8 -NoNewline
        Write-Host "Changelog:`n$body"

    - name: Create distribution
      id: dist
      shell: pwsh
      run: |
        $serverBin = "src/Rhombus.WinFormsMcp.Server/bin/Release/net8.0-windows"
        $hostBin   = "src/Rhombus.WinFormsMcp.RendererHost/bin/Release"
        $stagingDir = "dist-staging"

        # Stage server binaries
        New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
        Copy-Item -Path "$serverBin/winformsmcp.exe" -Destination "$stagingDir/" -Force
        foreach ($ext in @("*.dll", "*.json")) {
          Get-ChildItem -Path $serverBin -Filter $ext | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "$stagingDir/" -Force
          }
        }

        # Stage RendererHost binaries (one subfolder per TFM)
        foreach ($tfm in @("net48", "netcoreapp3.1", "net8.0-windows")) {
          $src = "$hostBin/$tfm"
          $dest = "$stagingDir/rendererhost/$tfm"
          if (Test-Path $src) {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Copy-Item -Path "$src/*" -Destination $dest -Recurse -Force
            Write-Host "Copied RendererHost/$tfm -> $dest"
          } else {
            Write-Warning "RendererHost build output not found: $src"
          }
        }

        # Create zip for GitHub Release
        $zipName = "winformsmcp-v${{ steps.version.outputs.version }}-win-x64.zip"
        Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName -Force
        Write-Host "Created $zipName"
        echo "zip_path=$zipName" >> $env:GITHUB_OUTPUT

        # Copy staged files to npm/dist
        New-Item -ItemType Directory -Path "npm/dist" -Force | Out-Null
        Copy-Item -Path "$stagingDir/*" -Destination "npm/dist/" -Recurse -Force

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: Release ${{ steps.version.outputs.version }}
        body_path: changelog.md
        draft: false
        prerelease: false

    - name: Upload release zip
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.dist.outputs.zip_path }}
        asset_name: ${{ steps.dist.outputs.zip_path }}
        asset_content_type: application/zip

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Update npm for OIDC support
      run: npm install -g npm@latest

    - name: Publish to NPM
      run: |
        cd npm
        npm publish --access public --provenance

    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: butler.software

    # Publish order is contracts first, bridge second, server last; NuGet has
    # no cross-package transaction, so --skip-duplicate makes a failed rerun safe.
    - name: Publish to NuGet
      shell: pwsh
      run: |
        $packages = @(
          "Rhombus.WinFormsMcp.RuntimeContracts",
          "Rhombus.WinFormsMcp.RuntimeBridge",
          "Rhombus.WinFormsMcp"
        )
        foreach ($packageId in $packages) {
          $nupkg = "./package-publish/nuget/$packageId.${{ steps.version.outputs.version }}.nupkg"
          Write-Host "Publishing $($nupkg) to NuGet..."
          dotnet nuget push $nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        }
