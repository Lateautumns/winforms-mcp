name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET (pinned SDK from global.json)
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Setup MSBuild (Visual Studio)
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: dotnet restore Rhombus.WinFormsMcp.sln

    - name: Verify code formatting
      run: dotnet format Rhombus.WinFormsMcp.sln --verify-no-changes --verbosity quiet

    - name: Build solution
      run: dotnet build Rhombus.WinFormsMcp.sln --configuration Release --no-restore

    - name: Build RendererHost (multi-target)
      run: dotnet build src/Rhombus.WinFormsMcp.RendererHost/Rhombus.WinFormsMcp.RendererHost.csproj --configuration Release --no-restore

    - name: Run tests with coverage
      run: dotnet test Rhombus.WinFormsMcp.sln --configuration Release --no-build --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Check the three NuGet packages
      shell: pwsh
      run: ./scripts/pack-nuget.ps1 -Configuration Release -OutputRoot ./package-check

    - name: Smoke-test .NET Framework 4.7.2 consumers
      shell: pwsh
      run: ./scripts/verify-net472-consumers.ps1 -Configuration Release -PackageRoot ./package-check/nuget

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage/report -reporttypes:"HtmlInline_AzurePipelines;Cobertura;TextSummary"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./coverage/report/
