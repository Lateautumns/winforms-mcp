name: Release Beta

on:
  workflow_dispatch:

concurrency:
  group: release-beta
  cancel-in-progress: true

jobs:
  release-beta:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate beta release ref
      shell: pwsh
      run: |
        $releaseRef = "${{ github.ref }}"
        if (-not $releaseRef.StartsWith("refs/heads/")) {
          throw "Beta releases must be dispatched from a branch ref; got '$releaseRef'."
        }
        if ($releaseRef -eq "refs/heads/main") {
          throw "Dispatch the beta workflow from a feature or release branch, not main. Pushing a beta version commit to main would trigger the stable release workflow."
        }

    - name: Setup .NET (pinned SDK from global.json)
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Setup MSBuild (Visual Studio)
      uses: microsoft/setup-msbuild@v2

    - name: Analyze commits for version bump
      id: bump-type
      shell: pwsh
      run: |
        $commits = git log --oneline --no-merges origin/main..HEAD 2>$null
        Write-Host "Commits since main:`n$commits"

        $bumpType = "patch"
        foreach ($line in ($commits -split "`n")) {
          if ($line -match 'BREAKING CHANGE:') {
            $bumpType = "major"
            break
          }
          if ($line -match '^\w+ feat:') {
            $bumpType = "minor"
          }
        }

        Write-Host "Version bump type: $bumpType"
        echo "bump_type=$bumpType" >> $env:GITHUB_OUTPUT

    - name: Bump version
      id: bump
      shell: pwsh
      run: |
        # Read current version
        $version = (Get-Content VERSION).Trim() -replace '-beta$', ''

        # Parse version
        $parts = $version.Split('.')
        $major = [int]$parts[0]
        $minor = [int]$parts[1]
        $patch = [int]$parts[2]

        # Bump based on type
        $bumpType = "${{ steps.bump-type.outputs.bump_type }}"
        switch ($bumpType) {
          "major" {
            $major++
            $minor = 0
            $patch = 0
          }
          "minor" {
            $minor++
            $patch = 0
          }
          "patch" {
            $patch++
          }
        }

        # Create new version with beta suffix and sync every version source
        $newVersion = "$major.$minor.$patch-beta"
        Write-Host "New version: $newVersion"
        ./scripts/sync-version.ps1 -NewVersion $newVersion

        echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT
        echo "bump_type=$bumpType" >> $env:GITHUB_OUTPUT

    # Release gates validate the final beta version and the exact NuGet files
    # that will be published. No commit or remote mutation occurs before them.
    - name: Restore dependencies
      run: dotnet restore Rhombus.WinFormsMcp.sln

    - name: Verify code formatting
      run: dotnet format Rhombus.WinFormsMcp.sln --verify-no-changes --verbosity quiet

    - name: Build
      run: dotnet build Rhombus.WinFormsMcp.sln --configuration Release --no-restore

    - name: Build RendererHost (multi-target)
      run: dotnet build src/Rhombus.WinFormsMcp.RendererHost/Rhombus.WinFormsMcp.RendererHost.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test Rhombus.WinFormsMcp.sln --configuration Release --no-build --logger "console;verbosity=detailed"

    - name: Check the three NuGet packages
      shell: pwsh
      run: ./scripts/pack-nuget.ps1 -Configuration Release -Version ${{ steps.bump.outputs.new_version }} -OutputRoot ./package-publish

    - name: Smoke-test .NET Framework 4.7.2 consumers
      shell: pwsh
      run: ./scripts/verify-net472-consumers.ps1 -Configuration Release -PackageRoot ./package-publish/nuget

    - name: Commit version bump
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add VERSION npm/package.json src/Rhombus.WinFormsMcp.Server/Rhombus.WinFormsMcp.Server.csproj src/Rhombus.WinFormsMcp.RuntimeContracts/Rhombus.WinFormsMcp.RuntimeContracts.csproj src/Rhombus.WinFormsMcp.RuntimeBridge/Rhombus.WinFormsMcp.RuntimeBridge.csproj
        git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} (${{ steps.bump.outputs.bump_type }})"
        git push

    # NPM beta publishing disabled — only stable releases publish to npm

    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: butler.software

    # Publish order is contracts first, bridge second, server last; NuGet has
    # no cross-package transaction, so --skip-duplicate makes a failed rerun safe.
    - name: Publish beta to NuGet
      shell: pwsh
      run: |
        $packages = @(
          "Rhombus.WinFormsMcp.RuntimeContracts",
          "Rhombus.WinFormsMcp.RuntimeBridge",
          "Rhombus.WinFormsMcp"
        )
        foreach ($packageId in $packages) {
          $nupkg = "./package-publish/nuget/$packageId.${{ steps.bump.outputs.new_version }}.nupkg"
          Write-Host "Publishing $($nupkg) to NuGet with beta tag..."
          dotnet nuget push $nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        }
